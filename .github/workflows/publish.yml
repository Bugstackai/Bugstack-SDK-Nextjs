# Publishes bugstack-sdk to npm when a GitHub release is published.
#
# Trusted publishing: npm verifies this workflow's GitHub OIDC identity, so
# there is no npm token anywhere — not in repo secrets, not on a laptop. A
# token is the thing an attacker steals to publish a malicious version; with
# none in existence, publishing requires this repository and this workflow.
# Every version also gets a provenance attestation linking it to the commit it
# was built from (customers can check with `npm audit signatures`).
#
# One-time setup on npmjs.com: bugstack-sdk → Settings → Trusted Publisher →
# GitHub Actions, repository Bugstackai/Bugstack-SDK-Nextjs, workflow
# publish.yml, environment npm-publish. Then set "Publishing access" to
# require 2FA and disallow tokens.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      # Actions pinned to commit SHAs: a tag can be moved to different code,
      # a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.6.2

      - name: Release tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      # --ignore-scripts: no dependency's install script runs on the machine
      # that holds publish rights.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run typecheck

      - run: pnpm run build

      # Print exactly which files go into the package, so the release log
      # shows what customers will receive.
      - run: npm pack --dry-run

      - run: npm publish --access public
